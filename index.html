<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お出かけ前チェック</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1f2937;display:flex;justify-content:center;padding:48px 16px}.app{width:100%;max-width:430px;background:white;border-radius:20px;padding:28px 24px;box-shadow:0 8px 28px #1f293714}h1{font-size:24px;margin:0 0 8px}.sub{color:#64748b;margin:0 0 24px}.item{display:flex;align-items:center;gap:14px;padding:18px 14px;margin:12px 0;border:1px solid #dce3ec;border-radius:12px;cursor:pointer;font-size:18px;font-weight:600}.item:has(input:checked){background:#ecfdf5;border-color:#86efac}.item input{width:24px;height:24px;accent-color:#16a34a;cursor:pointer}.status{text-align:center;margin:24px 0 16px;font-weight:700;font-size:17px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#16a34a;transition:width .2s}button{margin-top:24px;width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#334155;font-size:16px;cursor:pointer}button:hover{background:#f8fafc}.note{font-size:12px;color:#64748b;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main class="app">
<h1>お出かけ前チェック</h1>
<p class="sub">忘れ物や確認漏れを防ぎましょう。</p>
<label class="item"><input type="checkbox" id="door"> 🔒 ドアの施錠</label>
<label class="item"><input type="checkbox" id="light"> 💡 部屋の消灯</label>
<label class="item"><input type="checkbox" id="wallet"> 👛 財布の有無</label>
<div class="progress" role="progressbar" aria-label="確認の進捗" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div>
<p class="status" id="status" aria-live="polite">0 / 3 項目を確認済み</p>
<button type="button" id="reset">チェックをリセット</button>
<p class="note">チェック状態はこのブラウザに保存されます。</p>
</main>
<script>
const ids=['door','light','wallet'];
const key='daily-check-v1';
const boxes=ids.map(id=>document.getElementById(id));
try{const saved=JSON.parse(localStorage.getItem(key)||'{}');boxes.forEach(box=>box.checked===false&&(box.checked=!!saved[box.id]));}catch(e){}
function update(){const count=boxes.filter(box=>box.checked).length;document.getElementById('status').textContent=count===3?'✅ すべて確認完了！':`${count} / 3 項目を確認済み`;document.getElementById('bar').style.width=`${count/3*100}%`;document.getElementById('progress').setAttribute('aria-valuenow',String(count));try{localStorage.setItem(key,JSON.stringify(Object.fromEntries(boxes.map(box=>[box.id,box.checked]))));}catch(e){}}
boxes.forEach(box=>box.addEventListener('change',update));
document.getElementById('reset').addEventListener('click',()=>{boxes.forEach(box=>box.checked=false);update();});
update();
</script>
</body>
</html>
