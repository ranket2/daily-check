<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お出かけ前チェック</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fa; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1f2937; display: flex; justify-content: center; padding: 48px 16px; }
    .app { width: 100%; max-width: 430px; background: white; border-radius: 20px; padding: 28px 24px; box-shadow: 0 8px 28px #1f293714; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .sub { color: #64748b; margin: 0 0 24px; }
    .item { display: flex; align-items: center; gap: 14px; padding: 18px 14px; margin: 12px 0; border: 1px solid #dce3ec; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: 600; }
    .item:has(input:checked) { background: #ecfdf5; border-color: #86efac; }
    .item input { width: 24px; height: 24px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }
    /* 【追加】項目名と確認日時を縦に並べる */
    .item-content { display: flex; flex-direction: column; gap: 5px; }
    .checked-at { font-size: 12px; font-weight: 400; color: #64748b; }
    .status { text-align: center; margin: 24px 0 16px; font-weight: 700; font-size: 17px; }
    .progress { height: 9px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .bar { height: 100%; width: 0; background: #16a34a; transition: width .2s; }
    button { margin-top: 24px; width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; color: #334155; font-size: 16px; cursor: pointer; }
    button:hover { background: #f8fafc; }
    /* 【追加 v1.2】日別履歴の表示 */
    .history { margin-top: 28px; border-top: 1px solid #e2e8f0; padding-top: 22px; }
    .history h2 { font-size: 20px; margin: 0 0 12px; }
    .history-day { padding: 14px; border: 1px solid #dce3ec; border-radius: 12px; margin: 12px 0; }
    .history-day h3 { font-size: 15px; margin: 0 0 10px; }
    .history-day p { font-size: 14px; margin: 7px 0; }
    .history-empty { font-size: 14px; color: #64748b; }
    .history button { margin-top: 12px; }
    /* 【追加 v1.3】チェック項目の管理画面 */
    .manage { margin-top: 20px; padding: 16px 0 4px; border-top: 1px solid #e2e8f0; }
    .manage h2 { font-size: 18px; margin: 0 0 12px; }
    .add-form { display: flex; gap: 8px; align-items: stretch; }
    .add-form input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; }
    .add-form button { margin: 0; width: auto; white-space: nowrap; padding: 10px 14px; }
    .manage-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .manage-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eef2f7; font-size: 14px; }
    .manage-list li span { overflow-wrap: anywhere; min-width: 0; }
    .manage-list button { width: auto; margin: 0; padding: 7px 12px; color: #b91c1c; font-size: 14px; flex-shrink: 0; }
    .manage-help { font-size: 12px; color: #64748b; margin: 8px 0; }
    /* 【追加 v1.4】過去3日間の履歴表示（既存の日別履歴の下） */
    .recent-history { margin-top: 28px; border-top: 1px solid #e2e8f0; padding-top: 22px; }
    .recent-history h2 { font-size: 20px; margin: 0 0 8px; }
    .recent-help { font-size: 13px; color: #64748b; margin: 0 0 14px; }
    .recent-day { padding: 14px; border: 1px solid #dce3ec; border-radius: 12px; margin: 12px 0; }
    .recent-day h3 { font-size: 15px; margin: 0 0 10px; }
    .recent-day p { font-size: 14px; margin: 7px 0; overflow-wrap: anywhere; }
    .recent-empty { color: #64748b; }
    .note { font-size: 12px; color: #64748b; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>お出かけ前チェック</h1>
    <p class="sub">忘れ物や確認漏れを防ぎましょう。</p>

    <!-- 【変更】各項目に確認日時の表示領域を追加 -->
    <label class="item">
      <input type="checkbox" id="door">
      <span class="item-content">🔒 ドアの施錠 <span class="checked-at" id="door-time">未確認</span></span>
    </label>
    <label class="item">
      <input type="checkbox" id="light">
      <span class="item-content">💡 部屋の消灯 <span class="checked-at" id="light-time">未確認</span></span>
    </label>
    <label class="item">
      <input type="checkbox" id="wallet">
      <span class="item-content">👛 財布の有無 <span class="checked-at" id="wallet-time">未確認</span></span>
    </label>

    <!-- 【追加 v1.3】新規項目もここに描画。初期3項目の下に追加 -->
    <div id="custom-items"></div>
    <!-- 【追加 v1.3】チェック項目の直下に追加・削除の管理機能 -->
    <section class="manage" aria-labelledby="manage-title">
      <h2 id="manage-title">項目の追加・削除</h2>
      <form class="add-form" id="add-form">
        <input id="new-item-name" type="text" maxlength="60" placeholder="新しいチェック項目" aria-label="新しいチェック項目" required>
        <button type="submit">＋ 追加</button>
      </form>
      <p class="manage-help">追加した項目は下の一覧から削除できます。初期の3項目は削除できません。</p>
      <ul class="manage-list" id="manage-list"></ul>
    </section>

    <div class="progress" role="progressbar" aria-label="確認の進捗" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" id="progress">
      <div class="bar" id="bar"></div>
    </div>
    <p class="status" id="status" aria-live="polite">0 / 3 項目を確認済み</p>
    <button type="button" id="reset">チェックをリセット</button>
    <!-- 【追加 v1.2】日別履歴エリア -->
    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">📅 日別履歴</h2>
      <div id="history-list"><p class="history-empty">まだ履歴はありません。</p></div>
      <button type="button" id="clear-history">履歴をすべて削除</button>
    </section>
    <!-- 【追加 v1.4】日別履歴の直下に、昨日から3日前までの履歴を表示 -->
    <section class="recent-history" aria-labelledby="recent-history-title">
      <h2 id="recent-history-title">📆 過去3日間の履歴</h2>
      <p class="recent-help">昨日・一昨日・3日前の確認記録です（今日の分は含みません）。</p>
      <div id="recent-history-list"></div>
    </section>
    <p class="note">チェック状態・確認日時・日別履歴・追加項目はこのブラウザに保存されます。</p>
  </main>

  <script>
    // 【変更 v1.3】初期3項目と追加項目を別々に管理する
    const defaultItems = [
      { id: 'door', name: '🔒 ドアの施錠' },
      { id: 'light', name: '💡 部屋の消灯' },
      { id: 'wallet', name: '👛 財布の有無' }
    ];
    const key = 'daily-check-v1';                // v1.2までのデータを引き継ぐ
    const timeKey = 'daily-check-times-v1';
    const historyKey = 'daily-check-history-v1';
    // 【追加 v1.3】追加項目と履歴の項目名を保存するキー
    const customKey = 'daily-check-custom-items-v1';
    const historyLabelsKey = 'daily-check-history-labels-v1';

    function readObject(storageKey) {
      try {
        const value = JSON.parse(localStorage.getItem(storageKey) || '{}');
        return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      } catch (e) { console.warn('読み込み失敗:', storageKey, e); return {}; }
    }
    function save(storageKey, value) {
      try { localStorage.setItem(storageKey, JSON.stringify(value)); }
      catch (e) { console.warn('保存失敗:', storageKey, e); }
    }
    const savedChecks = readObject(key);
    let checkedTimes = readObject(timeKey);
    let history = readObject(historyKey);
    let historyLabels = readObject(historyLabelsKey);
    // 【追加 v1.3】不正な保存データを除外して読み込む
    let customItems = [];
    try {
      const parsed = JSON.parse(localStorage.getItem(customKey) || '[]');
      if (Array.isArray(parsed)) customItems = parsed.filter(item =>
        item && typeof item.id === 'string' && /^custom-[a-z0-9-]+$/.test(item.id) &&
        typeof item.name === 'string' && item.name.trim().length > 0
      ).map(item => ({ id: item.id, name: item.name }));
    } catch (e) { console.warn('追加項目を読み込めませんでした', e); }

    const labels = Object.fromEntries(defaultItems.map(item => [item.id, item.name]));
    customItems.forEach(item => { labels[item.id] = item.name; });
    // 【追加 v1.3】削除した項目も履歴で名前を表示できるように保持
    Object.assign(historyLabels, Object.fromEntries(defaultItems.map(item => [item.id, item.name])));
    customItems.forEach(item => { historyLabels[item.id] = item.name; });

    function allItems() { return [...defaultItems, ...customItems]; }
    function localDateKey(isoString) {
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return null;
      const pad = n => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }
    function recordHistory(id, isoString) {
      const day = localDateKey(isoString);
      if (!day) return;
      if (!history[day] || typeof history[day] !== 'object' || Array.isArray(history[day])) history[day] = {};
      history[day][id] = isoString;
      historyLabels[id] = labels[id] || historyLabels[id] || id;
    }
    // 【変更 v1.3】以前の履歴の項目名を確保してから引き継ぐ
    if (localStorage.getItem(historyKey) === null) {
      allItems().forEach(item => { if (checkedTimes[item.id]) recordHistory(item.id, checkedTimes[item.id]); });
      save(historyKey, history);
    }
    function formatDateTime(isoString) {
      if (!isoString) return '未確認';
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return '未確認';
      const pad = n => String(n).padStart(2, '0');
      return `確認日時：${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }
    // 【追加 v1.3】新規チェック項目のHTMLを安全に作成
    function makeCustomItem(item) {
      const label = document.createElement('label');
      label.className = 'item';
      const box = document.createElement('input');
      box.type = 'checkbox'; box.id = item.id; box.checked = !!savedChecks[item.id];
      const content = document.createElement('span');
      content.className = 'item-content';
      const name = document.createElement('span');
      name.textContent = item.name; // HTMLを解釈させない
      const time = document.createElement('span');
      time.className = 'checked-at'; time.id = `${item.id}-time`;
      content.append(name, time); label.append(box, content);
      return label;
    }
    function renderCustomItems() {
      const container = document.getElementById('custom-items');
      container.replaceChildren(...customItems.map(makeCustomItem));
      customItems.forEach(item => attachCheckHandler(document.getElementById(item.id)));
    }
    function renderManageList() {
      const list = document.getElementById('manage-list');
      list.replaceChildren();
      customItems.forEach(item => {
        const li = document.createElement('li');
        const name = document.createElement('span'); name.textContent = item.name;
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = '削除';
        button.setAttribute('aria-label', `${item.name}を削除`);
        button.addEventListener('click', () => removeItem(item.id));
        li.append(name, button); list.appendChild(li);
      });
    }
    // 【変更 v1.3】削除済みの項目も過去履歴に残して表示する
    function renderHistory() {
      const list = document.getElementById('history-list');
      list.replaceChildren();
      const days = Object.keys(history).filter(day => /^\d{4}-\d{2}-\d{2}$/.test(day))
        .sort().reverse().filter(day => history[day] && typeof history[day] === 'object' &&
          Object.values(history[day]).some(iso => iso && !Number.isNaN(new Date(iso).getTime())));
      if (!days.length) {
        const empty = document.createElement('p'); empty.className = 'history-empty';
        empty.textContent = 'まだ履歴はありません。'; list.appendChild(empty); return;
      }
      days.forEach(day => {
        const section = document.createElement('div'); section.className = 'history-day';
        const title = document.createElement('h3'); title.textContent = day.replace(/-/g, '/');
        section.appendChild(title);
        Object.entries(history[day]).forEach(([id, iso]) => {
          const time = new Date(iso);
          if (!iso || Number.isNaN(time.getTime())) return;
          const p = document.createElement('p');
          const pad = n => String(n).padStart(2, '0');
          p.textContent = `${historyLabels[id] || labels[id] || id}　${pad(time.getHours())}:${pad(time.getMinutes())}`;
          section.appendChild(p);
        });
        list.appendChild(section);
      });
    }
    // 【追加 v1.4】ローカル日付で過去3日分の表示対象を作る
    // ISO文字列のUTC日付ではなく、端末の現地日付で判定する。
    function pastThreeDays() {
      const today = new Date();
      const days = [];
      for (let offset = 1; offset <= 3; offset++) {
        // 正午を使うことで夏時間切替時の時刻ずれを避ける
        const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() - offset, 12);
        const pad = n => String(n).padStart(2, '0');
        const key = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
        days.push({ key, label: `${key.replace(/-/g, '/')}（${'日月火水木金土'[date.getDay()]}）` });
      }
      return days;
    }
    // 【追加 v1.4】既存historyを読み取り、過去3日だけ表示する（保存データは変更しない）
    function renderRecentHistory() {
      const container = document.getElementById('recent-history-list');
      container.replaceChildren();
      pastThreeDays().forEach(day => {
        const section = document.createElement('div');
        section.className = 'recent-day';
        const heading = document.createElement('h3');
        heading.textContent = day.label;
        section.appendChild(heading);
        const records = history[day.key];
        let count = 0;
        if (records && typeof records === 'object' && !Array.isArray(records)) {
          Object.entries(records).forEach(([id, iso]) => {
            const date = new Date(iso);
            if (typeof iso !== 'string' || Number.isNaN(date.getTime()) || localDateKey(iso) !== day.key) return;
            const pad = n => String(n).padStart(2, '0');
            const line = document.createElement('p');
            line.textContent = `✓ ${historyLabels[id] || labels[id] || id}　${pad(date.getHours())}:${pad(date.getMinutes())}`;
            section.appendChild(line);
            count++;
          });
        }
        if (!count) {
          const empty = document.createElement('p');
          empty.className = 'recent-empty';
          empty.textContent = '記録なし';
          section.appendChild(empty);
        }
        container.appendChild(section);
      });
    }
    function boxes() { return allItems().map(item => document.getElementById(item.id)).filter(Boolean); }
    // 【変更 v1.3】進捗を固定の3項目ではなく、現在の項目数で計算
    function update() {
      const currentBoxes = boxes();
      const count = currentBoxes.filter(box => box.checked).length;
      const total = currentBoxes.length;
      document.getElementById('status').textContent = count === total ? '✅ すべて確認完了！' : `${count} / ${total} 項目を確認済み`;
      document.getElementById('bar').style.width = `${count / total * 100}%`;
      const progress = document.getElementById('progress');
      progress.setAttribute('aria-valuemax', String(total));
      progress.setAttribute('aria-valuenow', String(count));
      currentBoxes.forEach(box => {
        document.getElementById(`${box.id}-time`).textContent = box.checked ? formatDateTime(checkedTimes[box.id]) : '未確認';
      });
      save(key, Object.fromEntries(currentBoxes.map(box => [box.id, box.checked])));
      save(timeKey, checkedTimes);
      save(historyKey, history);
      save(customKey, customItems);
      save(historyLabelsKey, historyLabels);
      renderHistory();
      renderRecentHistory(); // 【追加 v1.4】チェック操作・履歴削除時に再描画
      renderManageList();
    }
    function attachCheckHandler(box) {
      box.addEventListener('change', () => {
        if (box.checked) {
          checkedTimes[box.id] = new Date().toISOString();
          recordHistory(box.id, checkedTimes[box.id]);
        } else delete checkedTimes[box.id];
        update();
      });
    }
    // 【追加 v1.3】項目の追加処理
    document.getElementById('add-form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('new-item-name');
      const name = input.value.trim();
      if (!name) return;
      if (allItems().some(item => item.name === name)) {
        window.alert('同じ名前の項目がすでにあります。'); return;
      }
      const id = `custom-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
      const item = { id, name };
      customItems.push(item); labels[id] = name; historyLabels[id] = name;
      renderCustomItems(); input.value = ''; update();
    });
    // 【追加 v1.3】初期3項目は削除不可。削除しても過去の履歴は保持
    function removeItem(id) {
      const item = customItems.find(entry => entry.id === id);
      if (!item || !window.confirm(`「${item.name}」をチェック項目から削除しますか？\n過去の日別履歴は残ります。`)) return;
      customItems = customItems.filter(entry => entry.id !== id);
      delete checkedTimes[id];
      delete labels[id];
      renderCustomItems(); update();
    }
    document.getElementById('reset').addEventListener('click', () => {
      boxes().forEach(box => { box.checked = false; });
      checkedTimes = {}; update();
    });
    document.getElementById('clear-history').addEventListener('click', () => {
      if (!window.confirm('日別履歴をすべて削除しますか？ この操作は元に戻せません。')) return;
      history = {}; update();
    });
    // 【変更 v1.3】初期項目と追加項目を読み込み、イベントを登録
    defaultItems.forEach(item => {
      const box = document.getElementById(item.id);
      box.checked = !!savedChecks[item.id]; attachCheckHandler(box);
    });
    renderCustomItems();
    update();
    // 【追加 v1.4】アプリを開いたまま日付が変わった場合も再描画する
    let recentRenderedOn = localDateKey(new Date().toISOString());
    function refreshRecentOnDateChange() {
      const today = localDateKey(new Date().toISOString());
      if (today !== recentRenderedOn) {
        recentRenderedOn = today;
        renderRecentHistory();
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshRecentOnDateChange();
    });
    window.addEventListener('focus', refreshRecentOnDateChange);
    window.setInterval(refreshRecentOnDateChange, 60 * 1000);
  </script>
</body>
</html>
